# ---------- Servidor ----------
server.port=8080
# 0.0.0.0 = acepta conexiones de otros equipos de la red (el telefono), no solo de esta PC
server.address=0.0.0.0

# ---------- MySQL ----------
# La base "cafeteria_utez" se crea sola la primera vez
spring.datasource.url=jdbc:mysql://localhost:3306/cafeteria_utez?createDatabaseIfNotExist=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USUARIO:root}
# Cambia "root" por la contrasena de tu MySQL (o define la variable DB_CONTRASENA)
spring.datasource.password=${DB_CONTRASENA:root}

# ---------- JPA ----------
# update = crea y ajusta las tablas a partir de las clases @Entity sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Fotos de platillos ----------
# Carpeta donde se guardan las fotos que sube el encargado (se crea junto al proyecto)
app.fotos.carpeta=fotos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Zona horaria para saber que dia es hoy (especial del dia) y la hora de los pedidos
app.zona-horaria=America/Mexico_City
