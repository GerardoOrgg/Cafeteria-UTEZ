server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/cafeteria_utez?createDatabaseIfNotExist=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CONTRASENA:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.fotos.carpeta=fotos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

app.zona-horaria=America/Mexico_City
