# Perfil "h2": para correr la API sin instalar MySQL.
# Se activa en IntelliJ: Run > Edit Configurations > Active profiles: h2
# (o escribiendo spring.profiles.active=h2 al final de application.properties)
# Los datos se guardan en la carpeta "datos" junto al proyecto.
spring.datasource.url=jdbc:h2:file:./datos/cafeteria;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true
